<div class="iframe-test-container">
  
  <div class="config-form">
    <h2>Iframe Configuration</h2>
    <p class="form-description">
      Configure parameters to use Unico SDK in iframe mode
    </p>

    <div class="input-group">
      <label for="iframeToken" class="input-label">
        Authentication Token *
        <span class="label-hint">Token provided by Unico</span>
      </label>
      <input
        id="iframeToken"
        type="text"
        [(ngModel)]="token"
        placeholder="Paste token here..."
        class="input-field"
        [disabled]="isInitialized || isProcessing"
        autocomplete="off"
      >
    </div>

    <div class="input-group">
      <label for="iframeTransactionId" class="input-label">
        Transaction ID *
        <span class="label-hint">Transaction identifier</span>
      </label>
      <input
        id="iframeTransactionId"
        type="text"
        [(ngModel)]="transactionId"
        placeholder="Ex: 12345-abcde-67890..."
        class="input-field"
        [disabled]="isProcessing"
        autocomplete="off"
      >
    </div>

    <div class="action-buttons">
      <button
        type="button"
        class="action-button init-button"
        [disabled]="!canInitialize"
        (click)="initializeSDK()"
      >
        <span *ngIf="!isProcessing || isInitialized">
          {{ isInitialized ? '✅ Initialized' : '🚀 Initialize SDK' }}
        </span>
        <span *ngIf="isProcessing && !isInitialized">
          ⏳ Initializing...
        </span>
      </button>

      <button
        type="button"
        class="action-button open-button"
        [disabled]="!canOpenTransaction"
        (click)="openTransaction()"
      >
        <span *ngIf="!isProcessing">🖼️ Open Transaction</span>
        <span *ngIf="isProcessing">⏳ Opening...</span>
      </button>

      <button
        type="button"
        class="action-button close-button"
        [disabled]="!canClose"
        (click)="closeSDK()"
      >
        <span *ngIf="!isProcessing">❌ Close SDK</span>
        <span *ngIf="isProcessing">⏳ Closing...</span>
      </button>
    </div>

    <div class="messages" *ngIf="errorMessage || successMessage">
      <div class="error-message" *ngIf="errorMessage">
        <strong>❌ Error:</strong> {{ errorMessage }}
      </div>
      <div class="success-message" *ngIf="successMessage">
        <strong>✅ Success:</strong> {{ successMessage }}
      </div>
    </div>

  </div>

  <div class="sdk-area">
    <div class="sdk-container" [class.active]="isInitialized">
      <div class="sdk-iframe">
        <div class="sdk-placeholder" *ngIf="!isInitialized">
          <div class="placeholder-icon">🖼️</div>
          <h3>SDK Iframe Area</h3>
          <p>Initialize SDK to start testing</p>
        </div>
        <div 
          id="unico_iframe_embedded"
          class="sdk-iframe-area">
        </div>
      </div>
    </div>
  </div>

</div>
