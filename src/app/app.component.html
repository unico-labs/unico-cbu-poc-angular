<div class="app-container">
  <app-home-screen 
    *ngIf="isCurrentScreen('home')"
    class="screen-container">
  </app-home-screen>

  <div 
    *ngIf="isCurrentScreen('iframe')"
    class="screen-container iframe-test-screen">
    <div class="test-header">
      <button 
        class="back-button" 
        (click)="handleBackToHome()"
        type="button">
        ← Back
      </button>
      <img 
        src="assets/logo-home.svg" 
        alt="Unico Logo" 
        class="test-logo">
      <h1>Iframe Box Test</h1>
      <p>SDK embedded in a page container</p>
    </div>

    <app-iframe-test />
  </div>

  <div 
    *ngIf="isCurrentScreen('modal')"
    class="screen-container modal-test-screen">
    <div class="test-header">
      <button 
        class="back-button" 
        (click)="handleBackToHome()"
        type="button">
        ← Back
      </button>
      <img 
        src="assets/logo-home.svg" 
        alt="Unico Logo" 
        class="test-logo">
      <h1>Modal Test</h1>
      <p>SDK displayed in an overlay modal</p>
    </div>

    <app-modal-test />
  </div>

  <div 
    *ngIf="isCurrentScreen('fullscreen')"
    class="screen-container fullscreen-test-screen">
    <div class="test-header">
      <button 
        class="back-button" 
        (click)="handleBackToHome()"
        type="button">
        ← Back
      </button>
      <img 
        src="assets/logo-home.svg" 
        alt="Unico Logo" 
        class="test-logo">
      <h1>Fullscreen Test</h1>
      <p>SDK occupying the entire browser screen</p>
    </div>

    <app-fullscreen-test />
  </div>

</div>
